<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" role="img" aria-label="hansraj@arch terminal session">
<defs>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0c0b16"/>
    <stop offset="1" stop-color="#08070f"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17152a"/>
    <stop offset="1" stop-color="#100e1d"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#ffffff" opacity="0.025"/>
  </pattern>
  <style>
    <![CDATA[
      .line { animation-name: reveal; animation-fill-mode: both; animation-timing-function: steps(34); }
      .out  { animation-timing-function: steps(46); }
      @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -2% 0 0); } }
      .caret { animation: blink 1.05s steps(1) infinite; animation-delay: 6s; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      text { font-size: 15px; }
      .p1 { fill: #a78bfa; } .p2 { fill: #60a5fa; } .p3 { fill: #5b5b7a; }
      .cmd { fill: #e7e7f2; } .mut { fill: #6b6b85; } .dir { fill: #60a5fa; }
      .hash { fill: #a78bfa; } .ok { fill: #4ade80; } .name { fill: #c4b5fd; }
    ]]>
  </style>
</defs>

<rect x="20" y="22" width="720" height="392" rx="16" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>

<rect x="10" y="10" width="740" height="412" rx="14" fill="url(#screen)" stroke="#2a2547" stroke-width="1"/>

