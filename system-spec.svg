<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Glowing Filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        fill: #FFB300;
        font-weight: bold;
        letter-spacing: 2px;
      }
      .stat-label {
        font-family: 'Courier New', Courier, monospace;
        font-size: 9px;
        fill: #8F9CAE;
        letter-spacing: 1px;
      }
      .stat-val {
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        fill: #FFFFFF;
        font-weight: bold;
      }
      
      /* Progress Bar Animations */
      @keyframes fill-neural {
        from { width: 0px; }
        to { width: 225px; } /* 90% of 250px */
      }
      @keyframes fill-edge {
        from { width: 0px; }
        to { width: 250px; } /* 100% of 250px */
      }
      @keyframes fill-creative {
        from { width: 0px; }
        to { width: 237px; } /* 95% of 250px */
      }
      @keyframes fill-web {
        from { width: 0px; }
        to { width: 250px; } /* 100% of 250px */
      }

      .bar-neural {
        animation: fill-neural 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      }
      .bar-edge {
        animation: fill-edge 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      }
      .bar-creative {
        animation: fill-creative 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      }
      .bar-web {
        animation: fill-web 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      }
    </style>
  </defs>

  <!-- Background Panel with high-tech borders -->
  <rect width="400" height="180" fill="#0D1117" rx="6" />
  <rect x="5" y="5" width="390" height="170" fill="none" stroke="#00E5FF" stroke-width="0.75" opacity="0.15" rx="4" />
  
  <!-- Frame Brackets -->
  <path d="M 5,20 L 5,5 L 20,5 M 380,5 L 395,5 L 395,20 M 395,160 L 395,175 L 380,175 M 20,175 L 5,175 L 5,160" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.4" filter="url(#glow-blue)" />

  <!-- Title Indicator -->
  <g transform="translate(20, 24)">
    <text x="0" y="0" class="title" filter="url(#glow-gold)">[ ARCHITECT STACK SPECIFICATIONS ]</text>
    <line x1="0" y1="6" x2="360" y2="6" stroke="#00E5FF" stroke-width="0.75" opacity="0.3" />
  </g>

  <!-- Skill Rows -->
  <!-- 1. Neural Core -->
  <g transform="translate(20, 52)">
    <text x="0" y="0" class="stat-label">NEURAL (AI ENGINE &amp; CV)</text>
    <text x="330" y="0" class="stat-val" fill="#00E5FF">90%</text>
    <rect x="0" y="6" width="250" height="6" fill="#1A202C" rx="3" />
    <rect x="0" y="6" width="225" height="6" fill="#00E5FF" class="bar-neural" rx="3" filter="url(#glow-blue)" />
  </g>

  <!-- 2. Edge / IoT -->
  <g transform="translate(20, 82)">
    <text x="0" y="0" class="stat-label">EDGE (IoT HARDWARE &amp; ESP32)</text>
    <text x="330" y="0" class="stat-val" fill="#FFB300">100%</text>
    <rect x="0" y="6" width="250" height="6" fill="#1A202C" rx="3" />
    <rect x="0" y="6" width="250" height="6" fill="#FFB300" class="bar-edge" rx="3" filter="url(#glow-gold)" />
  </g>

  <!-- 3. Creative / UI -->
  <g transform="translate(20, 112)">
    <text x="0" y="0" class="stat-label">CREATIVE (CINEMATIC DESIGN &amp; MOTION)</text>
    <text x="330" y="0" class="stat-val" fill="#00E5FF">95%</text>
    <rect x="0" y="6" width="250" height="6" fill="#1A202C" rx="3" />
    <rect x="0" y="6" width="237" height="6" fill="#00E5FF" class="bar-creative" rx="3" filter="url(#glow-blue)" />
  </g>

  <!-- 4. Web Engine -->
  <g transform="translate(20, 142)">
    <text x="0" y="0" class="stat-label">WEB ENGINE (NEXT.JS &amp; SERVERLESS)</text>
    <text x="330" y="0" class="stat-val" fill="#FFB300">100%</text>
    <rect x="0" y="6" width="250" height="6" fill="#1A202C" rx="3" />
    <rect x="0" y="6" width="250" height="6" fill="#FFB300" class="bar-web" rx="3" filter="url(#glow-gold)" />
  </g>

  <!-- Corner details -->
  <circle cx="370" cy="88" r="4" fill="#00E5FF" opacity="0.3" />
  <circle cx="370" cy="100" r="4" fill="#FFB300" opacity="0.3" />
  <circle cx="370" cy="112" r="4" fill="#00E5FF" opacity="0.3" />
</svg>
