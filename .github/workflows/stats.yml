# File: .github/workflows/stats.yml
# Free forever. Runs on GitHub's own servers — no Vercel, no hosting bill.
# It renders stats.svg from your live numbers and commits it back to this repo.

name: stats-card

on:
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  schedule:
    - cron: "17 */12 * * *" # ...and twice a day on its own
  push:
    branches: [main]

permissions:
  contents: write           # so the Action can commit stats.svg back

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: render stats.svg
        env:
          # No setup needed — GitHub hands every Action a free token.
          # Optional: add a classic PAT (read:user) as secret GH_PAT for the
          # two contribution tiles, and it'll be used automatically.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: Stormynubee
        run: node scripts/generate-stats.js
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats card [skip ci]"
          git push
